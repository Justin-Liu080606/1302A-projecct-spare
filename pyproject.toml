[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-study-planner"
version = "0.5.0"
description = "Priority-aware study scheduling balanced across dates and daily time windows"
readme = "README.md"
requires-python = ">=3.9"
keywords = ["study", "planner", "scheduling", "calendar", "education"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Education",
  "Topic :: Office/Business :: Scheduling",
]

[project.urls]
Homepage = "https://github.com/Justin-Liu080606/1302A-projecct-spare"
Repository = "https://github.com/Justin-Liu080606/1302A-projecct-spare"
Documentation = "https://github.com/Justin-Liu080606/1302A-projecct-spare#readme"

[project.scripts]
study-plan = "study_plan.__main__:main"

[tool.setuptools.packages.find]
include = ["study_plan*"]
exclude = ["tests*", "examples*", "docs*"]

[tool.setuptools.package-data]
study_plan = ["static/*.html", "static/*.css", "static/*.js"]
